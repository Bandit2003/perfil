<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <title>Formulario de Registro</title>
    <link rel="stylesheet" href="styles.css">
</head>

<body>

    <form id="registroForm">

        <div>
            <label for="name">Nombre de usuario:</label>
            <input type="text" id="name" name="name" required>
            <span id="nameError" class="error-message">Mínimo 6 caracteres, sin caracteres especiales.</span>
        </div>

        <div>
            <label for="password">Contraseña:</label>
            <input type="password" id="password" name="password" required>
            <span id="passwordError" class="error-message">Mínimo 8 caracteres, 1 mayúscula, 1 minúscula y 1
                número.</span>
        </div>

        <div>
            <label for="confirmPassword">Confirmar Contraseña:</label>
            <input type="password" id="confirmPassword" name="confirmPassword" required>
            <span id="confirmPasswordError" class="error-message">Las contraseñas no coinciden.</span>
        </div>

        <div>
            <label for="email">Correo Electrónico:</label>
            <input type="email" id="email" name="email" required>
            <span id="emailError" class="error-message">Ingrese un correo electrónico válido.</span>
        </div>

        <button type="submit" id="submitButton" disabled>Enviar</button>
    </form>

    <script>
        const nameInput = document.getElementById('name');
        const nameError = document.getElementById('nameError');
        const passwordInput = document.getElementById('password');
        const passwordError = document.getElementById('passwordError');
        const confirmPasswordInput = document.getElementById('confirmPassword');
        const confirmPasswordError = document.getElementById('confirmPasswordError');
        const emailInput = document.getElementById('email');
        const emailError = document.getElementById('emailError');
        const submitBtn = document.getElementById('submitButton');
        const form = document.getElementById('registroForm');

        const regexNombre = /^[a-zA-Z0-9]{6,}$/;
        const regexPassword = /^(?=.*[a-z])(?=.*[A-Z])(?=.*\d)[a-zA-Z\d]{8,}$/;
        const regexEmail = /^[^\s@]+@[^\s@]+\.[^\s@]+$/;

        function checkFormValidity() {
            const isNameValid = regexNombre.test(nameInput.value);
            const isEmailValid = regexEmail.test(emailInput.value);
            const isPasswordValid = regexPassword.test(passwordInput.value);
            const isConfirmValid = (confirmPasswordInput.value === passwordInput.value) && confirmPasswordInput.value !== '';

            if (isNameValid && isEmailValid && isPasswordValid && isConfirmValid) {
                submitBtn.disabled = false;
            } else {
                submitBtn.disabled = true;
            }
        }

        nameInput.addEventListener('input', function () {
            if (regexNombre.test(nameInput.value)) {
                nameInput.classList.replace('invalid', 'valid') || nameInput.classList.add('valid');
                nameError.style.display = 'none';
            } else {
                nameInput.classList.replace('valid', 'invalid') || nameInput.classList.add('invalid');
                nameError.style.display = 'block';
            }
            checkFormValidity();
        });

        emailInput.addEventListener('input', function () {
            if (regexEmail.test(emailInput.value)) {
                emailInput.classList.replace('invalid', 'valid') || emailInput.classList.add('valid');
                emailError.style.display = 'none';
            } else {
                emailInput.classList.replace('valid', 'invalid') || emailInput.classList.add('invalid');
                emailError.style.display = 'block';
            }
            checkFormValidity();
        });

        passwordInput.addEventListener('input', function () {
            if (regexPassword.test(passwordInput.value)) {
                passwordInput.classList.replace('invalid', 'valid') || passwordInput.classList.add('valid');
                passwordError.style.display = 'none';
            } else {
                passwordInput.classList.replace('valid', 'invalid') || passwordInput.classList.add('invalid');
                passwordError.style.display = 'block';
            }
            if (confirmPasswordInput.value !== '') {
                confirmPasswordInput.dispatchEvent(new Event('input'));
            }
            checkFormValidity();
        });

        confirmPasswordInput.addEventListener('input', function () {
            if (confirmPasswordInput.value === passwordInput.value && confirmPasswordInput.value !== '') {
                confirmPasswordInput.classList.replace('invalid', 'valid') || confirmPasswordInput.classList.add('valid');
                confirmPasswordError.style.display = 'none';
            } else {
                confirmPasswordInput.classList.replace('valid', 'invalid') || confirmPasswordInput.classList.add('invalid');
                confirmPasswordError.style.display = 'block';
            }
            checkFormValidity();
        });

        nameInput.addEventListener('blur', function () {
            if (regexNombre.test(nameInput.value)) {
                console.log("Verificando usuario en BD...");
                setTimeout(() => {
                    if (nameInput.value === 'admin123') {
                        alert("Nombre de usuario no disponible");
                    } else {
                        console.log("Nombre de usuario disponible");
                    }
                }, 1000);
            }
        });

        emailInput.addEventListener('blur', function () {
            if (regexEmail.test(emailInput.value)) {
                setTimeout(() => {
                    if (emailInput.value === 'mail@cristian.com') {
                        alert("Correo electrónico no disponible");
                    } else {
                        console.log("Correo electrónico disponible");
                    }
                }, 1000);
            }
        });

        form.addEventListener('submit', function (e) {
            e.preventDefault();
            alert("¡Éxito! Todos los campos son válidos y el formulario ha sido enviado.");
        });

    </script>
</body>

</html>
